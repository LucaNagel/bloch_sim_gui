name: Wheel smoke test

on:
  push:
    branches:
      - pre-release
  workflow_dispatch:

jobs:
  build_wheel:
    name: Smoke wheel on ${{ matrix.os }}
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[wheel-smoke]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: "auto"
            deployment_target: ""
          - os: windows-latest
            # Match the supported release architecture. Building win32 makes
            # pip fall back to compiling h5py and its native HDF5 dependency.
            cibw_archs: "AMD64"
            deployment_target: ""
          # Match the release wheel's declared macOS 14 compatibility.
          - os: macos-14
            cibw_archs: "arm64"
            deployment_target: "14.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set development version for smoke artifact
        shell: bash
        run: |
          CURRENT_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          python bump_version.py "${CURRENT_VER}.dev${{ github.run_number }}"

      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify OpenMP deployment target (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: bash scripts/check_macos_libomp_target.sh

      - name: Build and test one representative wheel
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "cp39-*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

      - name: Upload smoke wheel
        uses: actions/upload-artifact@v7
        with:
          name: smoke-wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl
