name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_release_commit:
    name: Verify tested main commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Verify tag matches the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          with open("pyproject.toml", "rb") as pyproject_file:
              project_version = tomllib.load(pyproject_file)["project"]["version"]

          tag_version = os.environ["TAG_NAME"].removeprefix("v")
          is_matching_development_tag = re.fullmatch(
              rf"{re.escape(project_version)}\.dev\d+", tag_version
          )
          if tag_version != project_version and not is_matching_development_tag:
              raise SystemExit(
                  f"Release tag version {tag_version!r} does not match package "
                  f"version {project_version!r} (or its .devN form)."
              )
          PY

      - name: Require a successful Tests run for this SHA on main
        uses: actions/github-script@v8
        with:
          script: |
            const sha = context.sha;
            const { owner, repo } = context.repo;
            const mainBranch = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: 'main',
            });
            const mainSha = mainBranch.data.commit.sha;
            if (mainSha !== sha) {
              const comparison = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: sha,
                head: mainSha,
              });
              if (comparison.data.merge_base_commit.sha !== sha) {
                core.setFailed(
                  `Release blocked: ${sha} is not reachable from current ` +
                  `main (${mainSha}).`
                );
                return;
              }
            }

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'tests.yml',
              branch: 'main',
              event: 'push',
              head_sha: sha,
              status: 'completed',
              per_page: 100,
            });

            const successfulRun = response.data.workflow_runs.find((run) =>
              run.head_sha === sha &&
              run.head_branch === 'main' &&
              run.event === 'push' &&
              run.status === 'completed' &&
              run.conclusion === 'success'
            );

            if (!successfulRun) {
              core.setFailed(
                `Release blocked: ${sha} has no successful completed ` +
                '`Tests` workflow run triggered by a push to main. Push and ' +
                'successfully test this exact commit on main before tagging it.'
              );
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner,
                repo,
                run_id: successfulRun.id,
                filter: 'latest',
                per_page: 100,
              }
            );
            const successfulTestJob = jobs.find((job) =>
              job.name === 'Full test suite' &&
              job.head_sha === sha &&
              job.status === 'completed' &&
              job.conclusion === 'success'
            );
            if (!successfulTestJob) {
              core.setFailed(
                `Release blocked: main workflow run ${successfulRun.html_url} ` +
                'does not contain a successful completed `Full test suite` job.'
              );
              return;
            }

            core.info(`Using successful main test run: ${successfulRun.html_url}`);

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: verify_release_commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: "auto"
            deployment_target: ""
          - os: windows-latest
            # The scientific Python stack no longer reliably ships win32
            # wheels (notably h5py), so publish 64-bit Windows wheels only.
            cibw_archs: "AMD64"
            deployment_target: ""
          # Pin Sonoma while the published wheel targets macOS 14. Homebrew's
          # libomp bottle must not require a newer deployment target.
          - os: macos-14
            cibw_archs: "arm64"
            deployment_target: "14.0"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set package version from development tag
        if: contains(github.ref_name, '.dev')
        shell: bash
        run: python bump_version.py "${GITHUB_REF_NAME#v}"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify OpenMP deployment target (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: bash scripts/check_macos_libomp_target.sh

      # Used to build wheels (binary packages)
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        # You can configure cibuildwheel in pyproject.toml if needed,
        # but defaults work well for most projects.

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: verify_release_commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set package version from development tag
        if: contains(github.ref_name, '.dev')
        shell: bash
        run: python bump_version.py "${GITHUB_REF_NAME#v}"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_apps:
    name: Build Apps on ${{ matrix.os }}
    needs: verify_release_commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
        include:
          - os: macos-14
            artifact_name: BlochSimulator_macOS
            asset_ext: .zip
            deployment_target: "14.0"
          - os: ubuntu-latest
            artifact_name: BlochSimulator_Linux
            asset_ext: .tar.gz
            deployment_target: ""
          - os: windows-latest
            artifact_name: BlochSimulator_Windows
            asset_ext: .zip
            deployment_target: ""

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set package version from development tag
        if: contains(github.ref_name, '.dev')
        shell: bash
        run: python bump_version.py "${GITHUB_REF_NAME#v}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify OpenMP deployment target (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: bash scripts/check_macos_libomp_target.sh

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build C Extension (In-place)
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          python setup.py build_ext --inplace

      - name: Run PyInstaller
        run: |
          pyinstaller bloch_gui.spec --noconfirm

      # --- Packaging Steps ---

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path BlochSimulator -DestinationPath ..\${{ matrix.artifact_name }}${{ matrix.asset_ext }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}${{ matrix.asset_ext }} BlochSimulator

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          # -y stores symlinks as links (crucial for .app bundles)
          zip -r -y ../${{ matrix.artifact_name }}${{ matrix.asset_ext }} BlochSimulator.app

      # --- Upload Artifacts ---

      - name: Upload App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}${{ matrix.asset_ext }}

  create_pre_release:
    name: Create Pre-Release (GitHub)
    needs: [build_wheels, build_sdist, build_apps]
    runs-on: ubuntu-latest
    if: contains(github.ref_name, '.dev')
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: apps
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Development Build ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            dist/*
            apps/*
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Development tags belong to GitHub pre-releases, not PyPI.
    if: ${{ !contains(github.ref_name, '.dev') }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release_stable_apps:
    name: Release Apps (Stable)
    needs: [build_apps]
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '.dev') }}
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: apps
          merge-multiple: true

      - name: Update Release with Apps
        uses: softprops/action-gh-release@v3
        with:
          files: apps/*
          draft: false
          prerelease: false
