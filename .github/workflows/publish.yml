name: Publish to PyPI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual triggering

jobs:
  test:
    # Packaging-only iterations on pre-release may request the representative
    # three-platform wheel matrix. Manual runs, main, and tags always test.
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/pre-release' && contains(github.event.head_commit.message, '[wheel-smoke]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy matplotlib cython PyQt5 pyqtgraph PyOpenGL imageio imageio-ffmpeg h5py nbformat
          # Install the package in editable mode to build C extension
          pip install -e ".[pulseq]"

      - name: Run tests
        run: |
          # Install system libraries required for PyQt5/GUI tests
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libxcb-cursor0 \
            libgl1 \
            libegl1
          # Force software rendering for headless CI
          export QT_QPA_PLATFORM=offscreen
          xvfb-run pytest tests/

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || (needs.test.result == 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/pre-release' && contains(github.event.head_commit.message, '[wheel-smoke]'))) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: "auto"
            deployment_target: ""
          - os: windows-latest
            # The scientific Python stack no longer reliably ships win32
            # wheels (notably h5py), so publish 64-bit Windows wheels only.
            cibw_archs: "AMD64"
            deployment_target: ""
          # Pin Sonoma while the published wheel targets macOS 14. Homebrew's
          # libomp bottle must not require a newer deployment target.
          - os: macos-14
            cibw_archs: "arm64"
            deployment_target: "14.0"

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify OpenMP deployment target (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: bash scripts/check_macos_libomp_target.sh

      - name: Bump version for dev build (Non-Main Branch)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # Extract current version from pyproject.toml
          CURRENT_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          # Create dev version compliant with PEP 440
          DEV_VER="${CURRENT_VER}.dev${{ github.run_number }}"
          echo "Bumping version to $DEV_VER for development build..."
          python bump_version.py "$DEV_VER"

      # Used to build wheels (binary packages)
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          # A wheel-smoke push builds only the oldest supported CPython ABI.
          CIBW_BUILD: ${{ needs.test.result == 'skipped' && 'cp39-*' || '*' }}
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        # You can configure cibuildwheel in pyproject.toml if needed,
        # but defaults work well for most projects.

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Bump version for dev build (Non-Main Branch)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          CURRENT_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          DEV_VER="${CURRENT_VER}.dev${{ github.run_number }}"
          echo "Bumping version to $DEV_VER for development build..."
          python bump_version.py "$DEV_VER"

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_apps:
    name: Build Apps on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
        include:
          - os: macos-14
            artifact_name: BlochSimulator_macOS
            asset_ext: .zip
            deployment_target: "14.0"
          - os: ubuntu-latest
            artifact_name: BlochSimulator_Linux
            asset_ext: .tar.gz
            deployment_target: ""
          - os: windows-latest
            artifact_name: BlochSimulator_Windows
            asset_ext: .zip
            deployment_target: ""

    steps:
      - uses: actions/checkout@v6

      - name: Bump version for dev build (Non-Main Branch)
        if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          CURRENT_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          DEV_VER="${CURRENT_VER}.dev${{ github.run_number }}"
          echo "Bumping version to $DEV_VER for development build..."
          python bump_version.py "$DEV_VER"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Verify OpenMP deployment target (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: bash scripts/check_macos_libomp_target.sh

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build C Extension (In-place)
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: |
          python setup.py build_ext --inplace

      - name: Run PyInstaller
        run: |
          pyinstaller bloch_gui.spec --noconfirm

      # --- Packaging Steps ---

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path BlochSimulator -DestinationPath ..\${{ matrix.artifact_name }}${{ matrix.asset_ext }}

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ../${{ matrix.artifact_name }}${{ matrix.asset_ext }} BlochSimulator

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          cd dist
          # -y stores symlinks as links (crucial for .app bundles)
          zip -r -y ../${{ matrix.artifact_name }}${{ matrix.asset_ext }} BlochSimulator.app

      # --- Upload Artifacts ---

      - name: Upload App Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}${{ matrix.asset_ext }}

  create_pre_release:
    name: Create Pre-Release (GitHub)
    needs: [build_wheels, build_sdist, build_apps]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/pre-release'
    permissions:
      contents: write  # Required to create releases
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: apps
          merge-multiple: true

      - name: Determine Version Tag
        id: get_version
        run: |
          CURRENT_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          DEV_VER="${CURRENT_VER}.dev${{ github.run_number }}"
          echo "VERSION=$DEV_VER" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Development Build ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: true
          files: |
            dist/*
            apps/*
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only run on tags
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  release_stable_apps:
    name: Release Apps (Stable)
    needs: [build_apps]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          path: apps
          merge-multiple: true

      - name: Update Release with Apps
        uses: softprops/action-gh-release@v3
        with:
          files: apps/*
          draft: false
          prerelease: false
